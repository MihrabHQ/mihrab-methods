[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mihrab-methods"
# Set from package.json when a release is built (.github/workflows/publish-python.yml).
version = "0.0.0"
description = "The prayer-time authorities' own calculation methods, each reproducing its published timetable to the minute: a port of the mihrab-methods library."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MPL-2.0" }
authors = [{ name = "Hassan El Ghamri" }]
keywords = ["prayer-times", "salah", "adhan", "islam", "diyanet", "mihrab"]
classifiers = [
  "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
  "Programming Language :: Python :: 3",
  "Topic :: Religion",
]
dependencies = ["tzdata; platform_system == 'Windows'"]

[project.urls]
Homepage = "https://github.com/MihrabHQ/mihrab-methods"
Documentation = "https://github.com/MihrabHQ/mihrab-methods/tree/main/ports/python"
Changelog = "https://github.com/MihrabHQ/mihrab-methods/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["mihrab_methods"]

[tool.setuptools.package-data]
mihrab_methods = ["data/*.json", "data/corrections/*.json"]
