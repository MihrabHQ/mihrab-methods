name: feed

# What installed apps read, checked daily: certification.json and every
# correction list as served from main (schemas, the list the certification
# names, SHA-256, what an app does with it), and the published package
# installing and answering, and the public API answering (once API_URL is
# set). Fails when an app would refuse the feed or fall back to the method
# alone, or the API is down.

on:
  schedule:
    - cron: '13 5 * * *' # daily
  push:
    branches: [main]
    paths: ['certification.json', 'data/corrections/**', 'schemas/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The live feed
        run: npm run feed-check
      - name: The published package installs and answers
        if: always()
        run: |
          mkdir -p /tmp/consumer && cd /tmp/consumer && npm init -y >/dev/null
          for i in 1 2 3; do npm i --silent mihrab-methods@latest && break; [ $i = 3 ] && exit 1; sleep $((30 * i)); done
          node -e "const m=require('mihrab-methods/algeria');const {place}=m.nearestPlace('algeria',36.75,3.06);const d=m.timesFor(place,new Date().toISOString().slice(0,10));if(!/^\d\d:\d\d$/.test(d.times.fajr.printed))process.exit(1);console.log('CommonJS', d.status, d.times.fajr.printed)"
          node --input-type=module -e "import {places,timesFor} from 'mihrab-methods/indonesia';const d=timesFor(places[0],new Date().toISOString().slice(0,10));if(!d.times)process.exit(1);console.log('ESM', d.status)"
      - name: The API answers
        if: always() && vars.API_URL != ''
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          for i in 1 2 3; do
            body=$(curl -fsS --max-time 20 "$API_URL/v1/times?authority=algeria&lat=36.75&lng=3.06") && break
            [ $i = 3 ] && { echo "::error::$API_URL does not answer"; exit 1; }
            sleep $((30 * i))
          done
          echo "$body" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const r=JSON.parse(s);if(!/^\d\d:\d\d$/.test(r.times?.fajr?.printed))process.exit(1);console.log('API:',r.place.name,r.date,r.status,'revision',r.revision)})"
