# The documentation site: https://mihrabhq.github.io/mihrab-methods/
# GitHub Pages builds this folder with Jekyll on every push to main.
title: Mihrab Methods
tagline: Accurate Islamic prayer times for developers
description: >-
  Open-source Islamic prayer time calculation library: the calculation methods of
  national Islamic authorities, each verified against its published timetable to
  the minute. TypeScript, Python, Swift, Kotlin and Dart, offline, with a free HTTP API.
url: https://mihrabhq.github.io
baseurl: /mihrab-methods
lang: en
author: Hassan El Ghamri
markdown: kramdown
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings
relative_links:
  enabled: true
optional_front_matter:
  remove_originals: true
titles_from_headings:
  strip_title: false
defaults:
  - scope: { path: "" }
    values: { layout: default }
include:
  - llms.txt
